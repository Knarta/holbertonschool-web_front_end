<!DOCTYPE html>
<html lang="en" dir="ltr">

    <head>
        <meta charset="utf-8" />
        <title>Wikipedia Search</title>
        <script type="application/javascript" src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    </head>

    <body>
        <script type="application/javascript">
            function createSearchForm() {
                const textInput = $('<input type="text">');
                const submitInput = $('<input type="submit" value="Submit">');
                const ul = $('<ul></ul>');
                const pagination = $('<ul id="pagination"></ul>');
                
                $('body').append(textInput);
                $('body').append(submitInput);
                $('body').append(ul);
                $('body').append(pagination);
                
                submitInput.on('click', function(event) {
                    event.preventDefault();
                    const searchTerm = textInput.val().trim();
                    if (searchTerm) {
                        ul.empty();
                        queryWikipedia(searchTerm);
                    }
                });
            }

            function addNewArticle(id, title, snippet) {
                const li = $('<li></li>');
                const firstP = $('<p></p>');
                const span = $('<span>' + id + ' - </span>');
                const b = $('<b></b>').text(title);
                firstP.append(span);
                firstP.append(b);
                const secondP = $('<p></p>').html(snippet);
                li.append(firstP);
                li.append(secondP);
                $('ul').append(li);
            }

            function queryWikipedia(search, offset = 0) {
                const apiUrl = 'https://en.wikipedia.org/w/api.php';
                
                const data = {
                    action: 'query',
                    format: 'json',
                    list: 'search',
                    srsearch: search,
                    srlimit: 10,
                    origin: '*',
                    sroffset: offset
                };
                $.ajax({
                    url: apiUrl,
                    data: data,
                    dataType: 'json',
                    success: function(response) {
                        if (response.query && response.query.search) {
                            const results = response.query.search;
                            results.forEach(function(result) {
                                addNewArticle(result.pageid.toString(), result.title, result.snippet);
                            });
                            const totalHits = response.query.searchinfo.totalhits;
                            buildPagination(totalHits, 10, offset);
                        }
                    },
                    error: function() {
                        alert('Erreur lors de la récupération des données depuis Wikipedia.');
                    }
                });
            }

            function buildPagination(numberOfItems, itemsPerPage, currentOffset) {
                $('#pagination').empty();
                const totalPages = Math.ceil(numberOfItems / itemsPerPage);
                const currentPage = Math.floor(currentOffset / itemsPerPage) + 1;
                
                $('#pagination').css({
                    'display': 'flex',
                    'list-style': 'none',
                    'padding': '0',
                    'margin': '10px 0'
                });
                
                for (let i = 1; i <= totalPages; i++) {
                    const li = $('<li></li>');
                    const pageNumber = i;
                    const pageOffset = (i - 1) * itemsPerPage;
                    
                    li.css({
                        'cursor': 'pointer',
                        'margin-left': '10px'
                    });
                    
                    if (i === currentPage) {
                        li.css('font-weight', 'bold');
                    }
                    
                    li.text(pageNumber);
                    li.on('click', function() {
                        $('ul:not(#pagination)').empty();
                        const searchTerm = $('input[type="text"]').val().trim();
                        queryWikipedia(searchTerm, pageOffset);
                    });
                    
                    $('#pagination').append(li);
                }
            }
            $(document).ready(function() {
                createSearchForm();
            });
        </script>
    </body>
</html>
