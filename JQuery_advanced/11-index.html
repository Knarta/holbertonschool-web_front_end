<!DOCTYPE html>
<html lang="en" dir="ltr">

    <head>
        <meta charset="utf-8" />
        <title>Wikipedia Search</title>
        <script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    </head>

    <body>
        <script>
            function addPostRow(data) {
                const paragraph = $('<p>').html(`Post created with id <span>${data.id}</span>, title: <span>${data.title}</span>, author: <span>${data.author}</span>`);
                $('body').prepend(paragraph);
            }

            function listPosts() {
                $.get('http://localhost:3000/posts', function(data) {
                    for (let i = data.length - 1; i >= 0; i--) {
                        addPostRow(data[i]);
                    }
                }).fail(function() {
                    alert('Server Error');
                });
            }
            function sendForm() {
                $('form').after('<p>About to send the query to the API</p>');
                
                const data = {
                    title: $('#title').val(),
                    author: $('#author').val()
                };
                
                $.post('http://localhost:3000/posts', data)
                    .done(function(responseData) {
                        addPostRow(responseData);
                    })
                    .fail(function() {
                        alert('Error sending the POST query');
                    });
            }

            $(document).ready(function() {
                listPosts();
                buildForm();
            });


            function buildForm() {
                const form = $('<form>').on('submit', function(e) {
                    e.preventDefault();
                    sendForm();
                });
                
                const authorDiv = $('<div>');
                const authorLabel = $('<label>').attr('for', 'author').text('Author');
                const authorInput = $('<input>').attr({
                    type: 'text',
                    id: 'author'
                });
                authorDiv.append(authorLabel, authorInput);
                
                const titleDiv = $('<div>');
                const titleLabel = $('<label>').attr('for', 'title').text('Title');
                const titleTextarea = $('<textarea>').attr('id', 'title');
                titleDiv.append(titleLabel, titleTextarea);
                
                const submitInput = $('<input>').attr({
                    type: 'submit',
                    value: 'Submit'
                });
                
                form.append(authorDiv, titleDiv, submitInput);
        
                $('body').append(form);
            }
        </script>
    </body>
</html>
